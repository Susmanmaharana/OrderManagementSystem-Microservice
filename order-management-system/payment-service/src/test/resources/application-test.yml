spring:
  datasource:
    url: jdbc:h2:mem:payment_it_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

oms:
  payment:
    failure-rate: 0.0
    delay-ms: 0

logging:
  level:
    root: WARN
    com.oms.payment: INFO
