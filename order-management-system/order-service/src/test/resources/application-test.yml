oms:
  kafka:
    enabled: false
  inventory:
    base-url: http://localhost:8082
  payment:
    base-url: http://localhost:8083
    read-timeout-ms: 1000

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:order_it_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    root: WARN
    com.oms.order: INFO
