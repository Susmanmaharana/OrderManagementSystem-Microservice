oms:
  order:
    default-unit-price: ${DEFAULT_UNIT_PRICE:100.00}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: 2000
    # Acts as the call timeout for resilience demos (pair with PAYMENT_DELAY_MS on payment-service)
    read-timeout-ms: ${PAYMENT_READ_TIMEOUT_MS:3000}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      order-events: order-events
      payment-events: payment-events

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${ORDER_DB_URL:jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.oms.order: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [corr=%X{correlationId}] - %msg%n"
