# Full local stack (Phase 11). Kafka-only: docker-compose.kafka.yml
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oms_secret_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: ${POSTGRES_USER:-oms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oms_secret_change_me}
      DB_DRIVER: org.postgresql.Driver
    ports:
      - "8082:8082"

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: ${POSTGRES_USER:-oms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oms_secret_change_me}
      DB_DRIVER: org.postgresql.Driver
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.0}
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-0}
    ports:
      - "8083:8083"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: ${POSTGRES_USER:-oms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oms_secret_change_me}
      DB_DRIVER: org.postgresql.Driver
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    ports:
      - "8081:8081"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${POSTGRES_USER:-oms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oms_secret_change_me}
      DB_DRIVER: org.postgresql.Driver
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - order-service
      - inventory-service
      - payment-service
    environment:
      SERVER_PORT: 8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-key-32bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"

volumes:
  postgres_data:
